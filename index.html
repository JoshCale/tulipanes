<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Para la señorita de lentes 👓</title>

    <!-- Hoja de estilos -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         FONDO / PARTÍCULAS
    ========================== -->
    <div class="particles" id="particles"></div>


    <!-- =========================
         CONTENIDO PRINCIPAL
    ========================== -->
    <main class="contenedor">

        <!-- Título -->
        <header class="encabezado">

            <h1>
                Para la señorita de lentes
                <span class="lentes">👓</span>
            </h1>

            <p>
                Un pequeño detalle
                <span>🌷</span>
            </p>

        </header>


        <!-- =========================
             RAMO DE TULIPANES
        ========================== -->
        <section class="jardin">

            <div class="brillo-ramo"></div>

            <img
                src="tulips.png"
                alt="Un ramo de tulipanes rosados"
                class="ramo"
            >

        </section>


        <!-- =========================
             ABEJITA
        ========================== -->
        <div class="abejita" id="abejita">
            🐝
        </div>


        <!-- =========================
             BOTÓN
        ========================== -->
        <button
            class="boton-abrir"
            id="botonAbrir"
            type="button"
        >
            <span>Abrir</span>
            <span>🌷</span>
        </button>

    </main>


    <!-- =========================
         MODAL / MENSAJE
    ========================== -->
    <div
        class="modal"
        id="modal"
        aria-hidden="true"
    >

        <div class="modal-contenido">

            <button
                class="boton-cerrar"
                id="botonCerrar"
                type="button"
                aria-label="Cerrar"
            >
                ×
            </button>


            <div class="modal-icono">
                🌷
            </div>


            <h2>
                Para ti
            </h2>


            <p class="mensaje-principal">
                Dicen que los tulipanes significan
                muchas cosas...
            </p>


            <p>
                Yo solamente sé que una señorita
                de lentes dijo que eran sus favoritos.
                <span class="lentes">👓</span>
            </p>


            <p class="mensaje-final">
                Así que tocaba hacerle un pequeño
                ramito. 🌷
            </p>


            <div class="firma">
                — Un pequeño detalle
            </div>

        </div>

    </div>


    <!-- =========================
         SCRIPT
    ========================== -->
    <script src="script.js"></script>

</body>
</html>
